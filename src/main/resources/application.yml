server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  jackson:
    time-zone: UTC
  task:
    scheduling:
      pool:
        size: 3
app:
  admin-user: ${ADMIN_USER:admin}
  admin-password: ${ADMIN_PASSWORD:}
  feature-key: ${FEATURE_KEY:}
  data-dir: ${DATA_DIR:./data}
  local-password: ${LOCAL_DB_PASSWORD:}
  device-id: ${DEVICE_ID:terminal-001}
  punch-type: ${PUNCH_TYPE:PUNCH}
  camera:
    enabled: ${CAMERA_ENABLED:true}
    index: ${CAMERA_INDEX:0}
    backend: ${CAMERA_BACKEND:auto}
    width: ${CAMERA_WIDTH:640}
    height: ${CAMERA_HEIGHT:480}
    fps: ${CAMERA_FPS:30}
    fourcc: ${CAMERA_FOURCC:MJPG}
    preview-fps: ${PREVIEW_FPS:25}
    jpeg-quality: ${JPEG_QUALITY:75}
  face:
    detector: ${DETECTOR_MODEL:./models/face_detection_yunet_2023mar.onnx}
    recognizer: ${RECOGNIZER_MODEL:./models/face_recognition_sface_2021dec.onnx}
    threshold: ${FACE_THRESHOLD:0.50}
    margin: ${FACE_MARGIN:0.08}
    min-size: ${FACE_MIN_SIZE:80}
    min-blur: ${FACE_MIN_BLUR:45}
    confirm-frames: ${CONFIRM_FRAMES:3}
    interval-ms: ${RECOGNITION_INTERVAL_MS:350}
    dedup-seconds: ${DEDUP_SECONDS:60}
    cache-ttl-hours: ${CACHE_TTL_HOURS:24}
    threads: ${OPENCV_THREADS:2}
  cloud:
    enabled: ${CLOUD_ENABLED:true}
    url: ${CLOUD_DB_URL:}
    username: ${CLOUD_DB_USER:}
    password: ${CLOUD_DB_PASSWORD:}
    refresh-ms: ${CLOUD_REFRESH_MS:30000}
  third-party:
    enabled: ${THIRD_PARTY_ENABLED:false}
    url: ${THIRD_PARTY_URL:}
    token: ${THIRD_PARTY_TOKEN:}
    success-field: ${THIRD_PARTY_SUCCESS_FIELD:success}
    success-value: ${THIRD_PARTY_SUCCESS_VALUE:true}
    max-retries: ${THIRD_PARTY_MAX_RETRIES:12}
    event-id-field: ${THIRD_PARTY_EVENT_ID_FIELD:eventId}
    employee-id-field: ${THIRD_PARTY_EMPLOYEE_ID_FIELD:employeeId}
    device-id-field: ${THIRD_PARTY_DEVICE_ID_FIELD:deviceId}
    time-field: ${THIRD_PARTY_TIME_FIELD:occurredAt}
    type-field: ${THIRD_PARTY_TYPE_FIELD:punchType}
