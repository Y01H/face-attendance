<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实时人脸识别</title>
  <link rel="stylesheet" href="/face.css">
</head>
<body>
  <main>
    <section class="live-card" aria-label="实时人脸识别">
      <h1>实时画面</h1>
      <div class="video">
        <canvas id="camera" width="640" height="480" aria-label="实时摄像头画面"></canvas>
        <canvas id="boxes" width="640" height="480" aria-hidden="true"></canvas>
        <div id="cameraNotice" role="status">正在连接摄像头</div>
      </div>
      <div class="recognition" aria-live="polite">
        <strong id="message">等待识别…</strong>
        <span id="identity"></span>
      </div>
      <div id="cameraState" class="meta">正在连接…</div>
    </section>
  </main>
  <script src="/preview.js"></script>
  <script src="/face.js"></script>
</body>
</html>
